<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Altheia Healthcare Intelligence">
<title>Vertex · Centro de control diario</title>
<meta name="author" content="Jhonatan Muñoz">
<meta name="theme-color" content="#4f46e5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#7c5cff;--brand2:#ff5ca8;--brandtx:#cdbfff;--acc:#ffd84d;--bg:#0b0a22;--sf:rgba(255,255,255,.065);--sf2:rgba(255,255,255,.045);--solid:#16143a;--side:rgba(8,7,28,.62);--ink:#f4f3ff;--mu:#aeabd2;--ln:rgba(255,255,255,.11);--soft:rgba(129,140,248,.2);--ok:#2ee6a6;--warn:#ffc53d;--bad:#ff6b8b;--sh:0 10px 34px rgba(0,0,0,.28);--r:20px;color-scheme:dark}
[data-theme=violeta]{--bg:#240c55;--solid:#2a1670;--side:rgba(30,10,80,.55);--sf:rgba(255,255,255,.09);--sf2:rgba(255,255,255,.06);--soft:rgba(196,181,253,.22);--brandtx:#d8ceff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 600px at 88% -8%,rgba(124,92,255,.42),transparent 60%),radial-gradient(800px 600px at -8% 38%,rgba(34,211,238,.2),transparent 60%),radial-gradient(800px 600px at 70% 112%,rgba(255,92,168,.26),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
select option{background:#16143a;color:#f4f3ff}
button{cursor:pointer;border:0;background:none}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* layout */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);backdrop-filter:blur(18px);border-right:1px solid var(--ln);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 16px}
.brand b{font-size:21px;font-weight:800;letter-spacing:-.03em;color:#fff}
.brand small{display:block;font-size:11.5px;color:var(--mu);font-weight:600;margin-top:-3px}
.nav{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:13px;font-weight:600;color:var(--mu);text-align:left;width:100%;transition:.15s}
.nav:hover{background:var(--sf2);color:var(--ink)}
.nav.on{background:linear-gradient(135deg,rgba(124,92,255,.42),rgba(255,92,168,.28));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.ni{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.ni svg{width:18px;height:18px}
.nav .bd{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;font-weight:800;padding:1px 7px}
.side .sp{flex:1}
.sync{font-size:12px;color:var(--mu);padding:10px;border-radius:12px;background:var(--sf2);border:1px solid var(--ln)}
.sync b{display:block;color:var(--ink);font-size:12.5px}
main{min-width:0;padding:26px 28px 90px;max-width:1000px;width:100%;margin:0 auto}
.bottom{display:none}
@media(min-width:641px) and (max-width:1100px){
 .app{grid-template-columns:92px 1fr}.side{padding:14px 8px;align-items:center;gap:2px}
 .brand{padding:6px 0 12px}.brand>div:last-child{display:none}
 .nav{flex-direction:column;font-size:11.5px;justify-content:center;padding:8px 2px 7px;gap:5px;width:76px;text-align:center;line-height:1.1}
 .nav .bd{position:absolute;top:2px;right:6px;font-size:10px;padding:0 6px}
 .sync,.side .alt{display:none}
}
@media(max-width:640px){
 .app{grid-template-columns:1fr}.side{display:none}
 main{padding:18px 14px 96px}
 .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--solid);border-top:1px solid var(--ln);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
 .bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0;font-size:10.5px;font-weight:700;color:var(--mu);position:relative}
 .bottom button.on{color:#fff}.bottom button.on svg{filter:drop-shadow(0 0 6px #818cf8)}
}
/* base */
h1.t{font-size:28px;font-weight:800;letter-spacing:-.03em}
.sub{color:var(--mu)}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);box-shadow:var(--sh);backdrop-filter:blur(12px)}
.pad{padding:18px}
.grid{display:grid;gap:14px}.grid>*{min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp2{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 17px;border-radius:13px;font-weight:700;font-size:14.5px;transition:.15s;white-space:nowrap}
.btn.p{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 8px 22px rgba(255,92,168,.28)}
.btn.p:hover{transform:translateY(-1px)}
.btn.s{background:var(--soft);color:var(--brandtx)}
.btn.g{background:var(--sf2);border:1px solid var(--ln)}
.btn.d{background:rgba(229,72,77,.1);color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--mu);border:1px solid var(--ln);background:var(--sf)}
.ib:hover{color:var(--bad);border-color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--sf2);border:1px solid var(--ln);color:var(--mu);white-space:nowrap}
.chip.ok{background:rgba(22,163,74,.12);border-color:rgba(22,163,74,.3);color:var(--ok)}
.chip.warn{background:rgba(217,119,6,.12);border-color:rgba(217,119,6,.3);color:var(--warn)}
.chip.bad{background:rgba(229,72,77,.12);border-color:rgba(229,72,77,.3);color:var(--bad)}
.chip.br{background:var(--soft);border-color:transparent;color:var(--brandtx)}
.seg{display:flex;background:var(--sf);border:1px solid var(--ln);border-radius:13px;padding:4px;gap:2px;overflow-x:auto;margin-bottom:16px;width:fit-content;max-width:100%}
.seg button{padding:8px 16px;border-radius:10px;font-size:14px;font-weight:700;color:var(--mu);white-space:nowrap}
.seg button.on{background:var(--brand);color:#fff}
.hero{border-radius:24px;padding:24px;color:#fff;background:linear-gradient(130deg,#4f2df0,var(--brand) 42%,var(--brand2));position:relative;overflow:hidden}
.hero small{opacity:.85}
.hero .big{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.pb{height:9px;border-radius:99px;background:rgba(255,255,255,.25);margin:12px 0;overflow:hidden}
.pb i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .6s}
.bar{height:9px;border-radius:99px;background:var(--sf2);border:1px solid var(--ln);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .6s}
.sh{font-size:12px;font-weight:800;letter-spacing:.09em;color:var(--mu);text-transform:uppercase;margin:24px 0 10px}
.item{display:flex;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--ln)}
.item:last-child{border-bottom:0}
.item .em{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:var(--soft);flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tx small{color:var(--mu);font-size:12.5px}
.amt{font-weight:800;white-space:nowrap}
.empty{text-align:center;padding:34px 16px;color:var(--mu)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:14px;font-size:14px;border:1px solid}
.alert.warn{background:rgba(217,119,6,.1);border-color:rgba(217,119,6,.3)}
.alert.bad{background:rgba(229,72,77,.1);border-color:rgba(229,72,77,.3)}
.alert.ok{background:rgba(22,163,74,.1);border-color:rgba(22,163,74,.3)}
.alert.info{background:var(--soft);border-color:transparent}
.sc{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.sc button{padding:16px;border-radius:16px;text-align:left;color:#fff;display:flex;flex-direction:column;gap:3px;transition:.15s}
.sc button:hover{transform:translateY(-3px)}
.sc b{font-size:15px}.sc span{font-size:12px;opacity:.9}.sc .e{font-size:24px}
/* forms */
.inp{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--ln);border-radius:12px;padding:11px 13px;outline:0}
.inp:focus{border-color:var(--brandtx);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
label.f{display:block;font-size:13px;font-weight:700;margin-bottom:5px;color:var(--mu)}
.fg{margin-bottom:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mb{position:fixed;inset:0;background:rgba(8,6,24,.55);backdrop-filter:blur(4px);z-index:80;display:grid;place-items:center;padding:14px;animation:fd .2s both}
@keyframes fd{from{opacity:0}}
.mbox{width:min(520px,100%);max-height:calc(100vh - 28px);overflow:auto;background:var(--solid);border:1px solid var(--ln);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:mp .25s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes mp{from{opacity:0;transform:translateY(16px) scale(.97)}}
.mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--ln)}
.mh h3{flex:1;font-size:17px}
.mbody{padding:20px}
.mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--ln);background:rgba(255,255,255,.03)}
/* pin */
.lock{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;background:radial-gradient(900px 600px at 80% 0,#6d4ae0 0,transparent 60%),#17133f;padding:20px;text-align:center}
.shake{animation:sk .4s}@keyframes sk{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dw{font-size:11px;font-weight:800;color:var(--mu);text-align:center;padding:4px 0}
.cal .d{height:46px;border-radius:12px;background:var(--sf2);border:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:14px;gap:2px}
.cal .d.t{border-color:var(--brandtx);color:var(--brandtx)}
.cal .d.sel{background:var(--brand);color:#fff;border-color:var(--brandtx)}
.cal .d.x{background:transparent;border-color:transparent}
.cal .d i{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--ln);display:grid;place-items:center;color:#fff;flex:none;font-size:13px;font-weight:800;background:var(--sf)}
.chk.on{background:var(--ok);border-color:var(--ok)}
.pill{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.donut{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.leg{display:flex;flex-direction:column;gap:7px;font-size:13.5px;flex:1;min-width:170px}
.leg div{display:flex;gap:8px;align-items:center}.leg i{width:11px;height:11px;border-radius:4px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow:auto;padding:4px 2px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;font-size:14.5px}
.msg.u{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.b{align-self:flex-start;background:var(--sf2);border:1px solid var(--ln);border-bottom-left-radius:4px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--soft);color:#d9d7ff;padding:2px 7px;border-radius:6px;font-weight:700}
textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:200px;white-space:pre}
ol.st{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:9px}
ol.st li{counter-increment:s;display:flex;gap:12px;padding:11px 13px;border:1px solid var(--ln);border-radius:12px;background:var(--sf2);font-size:14px}
ol.st li::before{content:counter(s);flex:none;width:25px;height:25px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;font-size:12.5px;display:grid;place-items:center}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tst{background:#2a2670;border:1px solid rgba(255,255,255,.15);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:fd .2s both}
.fade{animation:up .35s ease both}@keyframes up{from{opacity:0;transform:translateY(8px)}}
@media(max-width:560px){.two{grid-template-columns:1fr}.hero .big{font-size:32px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ban{position:relative;overflow:hidden;border-radius:26px;padding:28px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:168px;margin-bottom:20px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.ban::before{content:"";position:absolute;right:-70px;top:-90px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.12)}
.ban::after{content:"";position:absolute;left:38%;bottom:-120px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
.ban .bt2{position:relative;z-index:1;max-width:520px}
.ban h1.t{font-size:30px}.ban .bs{opacity:.9;margin-top:2px}
.bart{position:relative;z-index:1;font-size:92px;line-height:1;filter:drop-shadow(0 14px 24px rgba(0,0,0,.35));animation:flt 5s ease-in-out infinite;transform:rotate(-8deg)}
.bart small{position:absolute;font-size:34px;right:-18px;top:-14px;animation:flt 4s ease-in-out infinite reverse}
.bart em{position:absolute;font-style:normal;font-size:26px;left:-26px;bottom:-4px;opacity:.9}
@keyframes flt{50%{transform:translateY(-9px) rotate(-4deg)}}
.btn.w{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);color:#fff;backdrop-filter:blur(6px)}
.btn.w:hover{background:rgba(255,255,255,.3)}
@media(max-width:560px){.bart em{display:none}.bart{font-size:60px}.ban{padding:20px;min-height:140px}.ban h1.t{font-size:24px}}
.intro{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;background:radial-gradient(900px 600px at 80% 0,#6d4ae0 0,transparent 60%),radial-gradient(700px 500px at 0 100%,#2563eb55 0,transparent 60%),#120f38;animation:iout .5s ease 2.1s forwards}
@keyframes iout{to{opacity:0;visibility:hidden}}
.intro .lg{animation:ipop .9s cubic-bezier(.2,.9,.3,1.3) both,flt 4s ease-in-out 1s infinite}
@keyframes ipop{from{opacity:0;transform:scale(.4) rotate(-20deg)}}
.intro h1{font-size:54px;font-weight:800;letter-spacing:-.04em;animation:up .7s ease .5s both}
.intro p{letter-spacing:.3em;font-size:12px;font-weight:700;color:#c7d2fe;animation:up .7s ease .8s both}
.lf{width:min(340px,90vw);display:flex;flex-direction:column;gap:6px;text-align:left;margin-top:6px}
.lf .inp{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:14px;padding:13px 14px;font-size:16px}
.lf .inp::placeholder{color:rgba(255,255,255,.45)}.lf label.f{color:#c7d2fe;margin:8px 0 0}
.lf .pw{position:relative}.lf .pw .inp{padding-right:52px}.lf .pw .ib{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:#fff}
.lf .lbtn{margin-top:16px;width:100%;justify-content:center;padding:14px}
.lk{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:4px}.lk button{background:none;border:0;color:#c7d2fe;text-decoration:underline;font-size:14px;cursor:pointer;padding:6px}
.lok{color:#a7f3d0;font-size:13.5px;font-weight:600;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stats div{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:13px 15px;display:flex;flex-direction:column;gap:4px}.stats small{color:var(--mu);font-size:12px;font-weight:700}.stats b{font-size:20px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.lerr{color:#ffb3c4;font-size:13.5px;font-weight:600;margin-top:8px}
.asg{display:grid;gap:16px}@media(min-width:960px){.asg{grid-template-columns:360px 1fr;align-items:start}.orbc{position:sticky;top:20px}}
.asg .chat{max-height:52vh;min-height:240px}.msg.a{align-self:flex-start;background:rgba(46,230,166,.12);border:1px solid rgba(46,230,166,.35);font-size:13.5px;max-width:94%}
.orbc{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.orb{position:relative;width:150px;height:150px;border-radius:50%;border:0;color:#fff;display:grid;place-items:center;background:linear-gradient(135deg,#7c5cff,#ff5ca8);box-shadow:0 14px 40px rgba(124,92,255,.5);cursor:pointer;margin:20px 0 10px}
.orb svg{width:56px;height:56px;position:relative;z-index:2;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.orb span{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.55);opacity:0;pointer-events:none}
.orb[data-st=idle]{animation:flt 4s ease-in-out infinite}
.orb[data-st=listen]{background:linear-gradient(135deg,#ff5ca8,#ff9f43);box-shadow:0 14px 40px rgba(255,92,168,.55)}
.orb[data-st=listen] span{animation:ripple 1.8s ease-out infinite}.orb[data-st=listen] .r2{animation-delay:.6s}.orb[data-st=listen] .r3{animation-delay:1.2s}
.orb[data-st=think]{background:linear-gradient(135deg,#22d3ee,#7c5cff)}
.orb[data-st=think] .r1{opacity:1;inset:-9px;border-color:#fff transparent transparent transparent;animation:spin 1s linear infinite}
.orb[data-st=speak]{background:linear-gradient(135deg,#2ee6a6,#22d3ee);box-shadow:0 14px 40px rgba(46,230,166,.5);animation:speakp 1.1s ease-in-out infinite}
.orb[data-st=speak] .r1{animation:ripple 1.4s ease-out infinite}
@keyframes ripple{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
@keyframes speakp{50%{transform:scale(1.07)}}
.vstat{font-weight:700;font-size:17px}.vtr{min-height:42px;color:var(--mu);font-style:italic;font-size:14px;max-width:300px}
.ge{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:24px;flex:none}
.intro .ring{position:absolute;width:210px;height:210px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.3);top:calc(50% - 160px);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chips6{display:flex;gap:10px;align-items:flex-end;height:120px}
.chips6 div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:11.5px;color:var(--mu)}
.chips6 i{width:100%;max-width:46px;border-radius:12px 12px 5px 5px;background:linear-gradient(180deg,#22d3ee,#7c5cff);min-height:4px;transition:height .6s}
.chips6 b{font-size:11px;color:var(--ink)}
.fq{display:flex;gap:6px;flex-wrap:wrap}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.demo{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:11px 14px;margin-bottom:14px;border-radius:14px;background:rgba(255,216,77,.12);border:1px solid rgba(255,216,77,.3);font-size:13.5px}
.al{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--ln);font-size:14px}
.al:last-child{border-bottom:0}

 .dash{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:start}
 .dl .hero{margin-bottom:6px}
 .cw{display:grid;grid-template-columns:1fr minmax(240px,300px);gap:30px;align-items:center;padding:8px 6px}
 .clg{display:flex;flex-direction:column;gap:6px}
 .cw .cb{display:none}
 .cw .cv{width:100%;aspect-ratio:1;margin:0}
 .cw .cv .ring{width:100%}
 .fab{right:30px;bottom:26px}
}
@media(min-width:960px){.dash{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:30px}}
.cv{position:relative;width:min(100%,400px);aspect-ratio:1;margin:4px auto}
.cv .ring{position:absolute;left:50%;top:50%;width:54%;transform:translate(-50%,-50%);filter:drop-shadow(0 0 18px rgba(124,92,255,.35))}
.cb{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:96px;text-align:center}
.cb.up{flex-direction:column-reverse}
.cb .cbub{box-shadow:0 10px 24px rgba(0,0,0,.38),inset 0 0 0 2px rgba(255,255,255,.22)}
.cb small{display:block;font-size:11px;color:var(--mu);font-weight:700;line-height:1.15}
.cb b{font-size:12.5px}
.cb.z b{opacity:.55}
@media(max-width:640px){.cw.many{display:flex;flex-direction:column-reverse}.cw.many .cb{display:none}.cw.many .clg{display:flex;flex-direction:column;gap:6px;margin-top:6px}.cw.many .cv{width:min(72%,270px);margin:4px auto}.cw.many .cv .ring{width:100%}}
@media(max-width:420px){.cb{width:80px}.cb small{font-size:10px}.cb b{font-size:11.5px}.cb .cbub{width:46px!important;height:46px!important}}

/* ===== ajustes móvil ===== */
@media(max-width:640px){
 main{padding-bottom:150px}
 .fab{width:56px;height:56px;padding:0;border-radius:50%;justify-content:center;grid-auto-flow:row;right:16px;bottom:86px}.fab span{display:none}
 .asg{grid-template-columns:minmax(0,1fr)}.asg>*,.card,.card.pad{min-width:0;max-width:100%}
 .asg .chip,.asg .chip.sg,.orbc .chip{white-space:normal;text-align:left;max-width:100%}
 .orbc .row,.asg .row{flex-wrap:wrap;justify-content:center}
 .item{flex-wrap:wrap;row-gap:8px}
 .item .tx{flex:1 1 130px;min-width:0}
 .item .tx b{white-space:normal;overflow:visible;text-overflow:clip}
 .item .tx small{white-space:normal}
 .item .amt{margin-left:auto}
 .ph{flex-wrap:wrap;gap:10px}
 .seg{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
 .mbox{border-radius:22px 22px 0 0}
 .inp,select,textarea{font-size:16px}
 .btn{min-height:44px}.ib{min-width:40px;min-height:40px}
}
</style>

const whenLabel=n=>{const d=new Date();d.setMonth(d.getMonth()+n);return d.toLocaleDateString('es-PE',{month:'long',year:'numeric'})};
const durLabel=n=>n>600?'más de 50 años':n<12?`${n} mes${n==1?'':'es'}`:`${Math.floor(n/12)} año${n>=24?'s':''}${n%12?` y ${n%12} mes${n%12==1?'':'es'}`:''}`;

function capacity(){const k=ym(today());let inc=D.income[k]||0;if(!inc){const ks=Object.keys(D.income).filter(x=>D.income[x]>0).sort();inc=ks.length?D.income[ks[ks.length-1]]:0}
 let gasto=Object.values(D.budgets||{}).reduce((a,b)=>a+(+b||0),0);
 if(!gasto){const ms=[0,1,2].map(i=>spentMonth(addMonth(k,-i))).filter(x=>x>0);gasto=ms.length?ms.reduce((a,b)=>a+b,0)/ms.length:0}
 return{inc,gasto,cap:Math.max(0,Math.round(inc-gasto)),sug:Math.round(inc*.15)}}
function planGoal(target,saved=0,monthly=0){const c=capacity(),rem=Math.max(0,target-saved),sc=[],seen={};
 const add=(lbl,m)=>{m=Math.round(m);if(m>0&&!seen[m]){seen[m]=1;const n=Math.ceil(rem/m);sc.push({lbl,m,n,when:whenLabel(n),dur:durLabel(n)})}};
 if(rem>0){if(monthly>0)add('Con lo que tú indicas',monthly);if(c.cap>0)add('Con tu capacidad real de ahorro',c.cap);if(c.inc>0){add('Ahorrando el 15% de tus ingresos',c.inc*.15);add('Ahorrando el 30% de tus ingresos',c.inc*.3)}}
 return{rem,sc,c}}
function planText(name,target,saved,monthly){const p=planGoal(target,saved,monthly);if(p.rem<=0)return`Ya tienes el dinero para ${name}.`;
 let t=`Meta: ${name}, cuesta ${money(target)}. Ya ahorrado ${money(saved)}. Falta ${money(p.rem)}. `;
 if(!p.sc.length)return t+'No hay ingresos registrados ni un ahorro mensual indicado: pregunta cuánto puede ahorrar al mes o cuál es su ingreso mensual.';
 return t+p.sc.map(x=>`${x.lbl}: ${money(x.m)} al mes, lo logras en ${x.dur} (${x.when}).`).join(' ')+(p.c.inc?` Ingreso ${money(p.c.inc)}, presupuesto mensual ${money(p.c.gasto)}.`:'')}

const byCat=k=>{const m={};D.expenses.filter(e=>ym(e.date)===k).forEach(e=>m[e.cat]=(m[e.cat]||0)+e.amount);return m};

async function api(action,data={}){
 const r=await fetch(ST.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,key:ST.key,...data})});
 const j=await r.json();if(!j.ok)throw new Error(j.error||'Error del conector');return j}
async function push(){if(!ST.url||D.demo)return;try{const j=await api('save',{data:D});mergeIn(j.data);ST.lastSync=Date.now();saveCfg();draw(true)}catch(e){console.warn(e)}}
function mergeIn(sd){if(!sd)return;const keep=D.updated;D={...newData(),...sd};D.updated=Math.max(keep,sd.updated||0);migrateCats();applyLearn();try{localStorage.setItem('vertex.data',JSON.stringify(D))}catch(e){}}
async function pull(){const j=await api('load');if(j.data&&Object.keys(j.data).length&&(j.data.updated||0)>=0&&(j.data.expenses||j.data.events)){mergeIn(j.data)}else{await push()}ST.lastSync=Date.now();saveCfg()}
async function scanMail(){const j=await api('scan',{data:D});mergeIn(j.data);ST.lastSync=Date.now();saveCfg();return j}

const MESES={enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,setiembre:9,septiembre:9,octubre:10,noviembre:11,diciembre:12,ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,set:9,sep:9,oct:10,nov:11,dic:12};
const flat=r=>r.replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&[a-z]+;/gi,' ').replace(/\s+/g,' ').trim();
const numS=s=>parseFloat(s.replace(/,(?=\d{3}\b)/g,'').replace(',','.'));
const cleanM=r=>r.replace(/^[A-Z]{2,6}\s?\*\s?/,'').replace(/\s+/g,' ').trim().toLowerCase().replace(/(^|[\s\-/])([a-záéíóúñ])/g,(_,a,b)=>a+b.toUpperCase());
function dateFrom(t){let a=t.match(/(\d{1,2}) de ([a-záéíóú]+) de (\d{4})/i)||t.match(/(\d{1,2}) ([a-záéíóú]{3,10})\.?,? (\d{4})/i);
 if(a){const m=MESES[a[2].toLowerCase()];if(m)return`${a[3]}-${p2(m)}-${p2(+a[1])}`}
 const b=t.match(/\b(\d{1,2})\/(\d{1,2})\/(\d{4})\b/);return b?`${b[3]}-${p2(+b[2])}-${p2(+b[1])}`:null}
function walletParse(raw){const text=raw.replace(/\s+/g,' ').trim();if(!text)return null;
 const MON='S\\/\\.?\\s?(\\d{1,3}(?:,\\d{3})*(?:\\.\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)';
 const app=/plin/i.test(text)&&!/yape/i.test(text)?'Plin':'Yape';const m=text.match(new RegExp(MON,'i'));if(!m)return null;
 const toN=r=>parseFloat(/,\d{1,2}$/.test(r)&&!r.includes('.')?r.replace(',','.'):r.replace(/,/g,''));const amount=toN(m[1]);if(!(amount>0))return null;
 const cl=w=>w.replace(/\s+/g,' ').replace(/[.!]+$/,'').trim();
 const out=text.match(new RegExp('(?:yapeaste|pagaste|enviaste|transferiste)\\s+'+MON+'\\s+(?:a|al)\\s+(.+)','i'));
 if(out)return{direction:'out',amount,who:cl(out[2]),app};
 const inc=text.match(new RegExp('(.+?)\\s+te\\s+(?:envi[oó]|yape[oó]|pag[oó]|transfiri[oó])\\s+(?:un pago\\s+)?(?:por\\s+)?'+MON,'i'))||text.match(new RegExp('recibiste\\s+'+MON+'\\s+de\\s+(.+)','i'));
 if(inc){const who=/recibiste/i.test(inc[0])?inc[2]:inc[1];return{direction:'in',amount,who:cl(who.replace(/^(yape|plin)[!:]?\s*/i,'')),app}}
 return null}
function freeParse(t){ // "gasté 25 en almuerzo", "25 soles taxi", "almuerzo 18.50"
 t=t.trim();let m=t.match(/(?:gast[eé]|pagu[eé]|compr[eé])?\s*(?:s\/\.?\s?)?(\d+(?:[.,]\d{1,2})?)\s*(?:soles|sol)?\s*(?:en|de|por|para)?\s*(.*)/i);
 if(!m){m=t.match(/(.+?)\s+(?:s\/\.?\s?)?(\d+(?:[.,]\d{1,2})?)\s*(?:soles)?$/i);if(!m)return null;return{amount:numS(m[2]),name:m[1].trim()}}
 const amount=numS(m[1]);if(!(amount>0))return null;return{amount,name:(m[2]||'Gasto').trim()||'Gasto'}}

const findBy=(l,n)=>{n=norm(n);return l.find(x=>norm(x.name||x.title)===n)||l.find(x=>{const m=norm(x.name||x.title);return m.includes(n)||n.includes(m)})};

function summaryText(){const k=ym(today()),c=capacity(),sp=spentMonth(k),inc=D.income[k]||0,m=byCat(k);
 let t=`Mes: ${monthLabel(k)}. Ingresos del mes: ${inc?money(inc):'no registrados'}. Gastado: ${money(sp)}.${inc?' Te quedan '+money(inc-sp)+'.':''}\n`;
 t+='Por categoría: '+(Object.keys(m).length?CATS.filter(x=>m[x.n]).map(x=>`${x.n} ${money(m[x.n])} (presupuesto ${money(D.budgets[x.n]||0)})`).join('; '):'sin gastos aún')+'.\n';
 t+=c.inc?`Capacidad de ahorro mensual estimada: ${money(c.cap)} (ingreso ${money(c.inc)} menos presupuesto mensual ${money(c.gasto)}). Meta sana 15%: ${money(c.sug)}.\n`:'Capacidad de ahorro: desconocida (no hay ingresos registrados).\n';
 t+='Metas: '+(D.goals.length?D.goals.map(g=>`${g.name} ${money(g.saved)} de ${money(g.target)}`).join('; '):'ninguna')+'.\n';
 const al=alerts().map(x=>strip(x.h+' '+x.s));t+='Pendientes y alertas: '+(al.length?al.join('; '):'nada urgente')+'.';return t}
function runTool(n,i){try{i=i||{};const k=ym(today());switch(n){
 case'get_summary':return summaryText();
 case'set_income':{const a=+i.amount;if(!(a>0))return'Error: monto inválido';const old=D.income[k];D.income[k]=a;save();actNote(`✓ Ingreso de ${monthLabel(k)}: ${money(a)}`,()=>{if(old)D.income[k]=old;else delete D.income[k]});return`Ingreso del mes guardado: ${money(a)}.`}

 case'learn_category':{const w=norm(i.word||'').trim();if(!w||!CATS.some(c=>c.n===i.category))return'Error: datos inválidos';const old=(D.learn||{})[w],ch=[];learnCat(w,i.category);D.expenses.forEach(e=>{if(!e.man&&e.cat!==i.category&&learnedOnly(e.name)===i.category){ch.push([e,e.cat]);e.cat=i.category}});save();actNote(`🧠 Aprendido: «${esc(w)}» → ${i.category}${ch.length?' · '+ch.length+' gasto(s) reclasificado(s)':''}`,()=>{if(old)D.learn[w]=old;else delete D.learn[w];ch.forEach(([e,c])=>e.cat=c)});return`Aprendido: ${w} va en ${i.category}. Reclasificados: ${ch.length}.`}
 case'add_event':{if(!okDate(i.date))return'Error: fecha inválida, usa AAAA-MM-DD';const e={id:uid(),title:cap1(String(i.title).trim()),date:i.date,time:/^\d{2}:\d{2}$/.test(i.time||'')?i.time:'',tipo:EVT.some(x=>x[0]===i.tipo)?i.tipo:'Personal',urgent:!!i.urgent,notes:i.notes||''};D.events.push(e);save();actNote(`✓ Evento: ${esc(e.title)} · ${e.date}${e.time?' '+e.time:''}${e.urgent?' · 🚨 urgente':''}`,()=>{D.events=D.events.filter(x=>x.id!==e.id)});return'Evento guardado.'}
 case'add_payment':{const p={id:uid(),name:cap1(String(i.name).trim()),amount:+i.amount,day:Math.min(31,Math.max(1,Math.round(+i.day||1))),paid:{}};if(!(p.amount>0))return'Error: monto inválido';D.payments.push(p);save();actNote(`✓ Pago registrado: ${esc(p.name)} · ${money(p.amount)} · día ${p.day}`,()=>{D.payments=D.payments.filter(x=>x.id!==p.id)});return'Pago guardado. Se avisará antes del vencimiento.'}

 const head=`<div class="ph"><div><h1 class="t">Administración</h1><div class="sub">Usuarios de Vertex y sus suscripciones</div></div><div class="row" style="gap:8px"><button class="btn p" data-a="adm-new">+ Crear usuario</button><button class="btn s" data-a="tab" data-t="ajustes">Volver</button></div></div>`;
 if(!us)return head+'<div class="card pad">Cargando…</div>';
 const c={a:0,p:0,v:0};us.forEach(u=>{if(u.role==='admin')return;const k=stOf(u)[1];if(k==='ok')c.a++;else if(k==='warn')c.p++;else c.v++});
 return head+`<div class="stats" style="margin-bottom:14px"><div><small style="display:block">Activos</small><b>${c.a}</b></div><div><small style="display:block">Pendientes</small><b>${c.p}</b></div><div><small style="display:block">Vencidos</small><b>${c.v}</b></div><div><small style="display:block">Total</small><b>${us.length}</b></div></div>
 <div class="card">${us.map(u=>{const[t,k]=stOf(u),me=u.id===PROF.id;return`<div class="item" style="flex-wrap:wrap;gap:10px"><div class="tx" style="flex:1 1 220px;min-width:0"><b>${esc(u.name||'')} ${u.role==='admin'?'👑':''}</b><small style="display:block">${esc(u.email)}</small><small style="display:block">Registro ${fmtDate((u.created_at||today()).slice(0,10))}${u.last_seen?' · Último ingreso '+fmtDate(u.last_seen.slice(0,10)):''}</small>${u.note?`<small style="display:block">📝 ${esc(u.note)}</small>`:''}</div><span class="chip ${k==='ok'?'':'sg'}" style="${k==='bad'?'color:#ff7a90':k==='warn'?'color:#ffb020':''}">${t}</span>${me?'':`<div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn p" data-a="adm-add" data-id="${u.id}">+30 días</button><button class="btn s" data-a="adm-edit" data-id="${u.id}">Editar</button>${u.active?`<button class="btn g" data-a="adm-off" data-id="${u.id}">Desactivar</button>`:''}<button class="btn s" data-a="adm-pass" data-id="${u.id}">Clave</button><button class="btn s" data-a="adm-role" data-id="${u.id}">${u.role==='admin'?'Quitar admin':'Hacer admin'}</button><button class="btn g" data-a="adm-del" data-id="${u.id}" style="color:#ff7a90">Eliminar</button></div>`}</div>`}).join('')||'<div class="empty">Aún no hay usuarios</div>'}</div>
 <p class="sub" style="margin:12px 0 90px;font-size:13px">Cuando un cliente te pague, toca <b>+30 días</b>: se activa su cuenta y se suma un mes desde hoy (o desde su vencimiento si aún está vigente). Tú no ves los gastos ni los datos de nadie, solo el estado de la cuenta.</p>`}

<script type="text/plain" id="gs-code">
/**
 * CONECTOR VERTEX — Centro de control diario
 * Diseñado por Altheia Healthcare Intelligence · Concepto y desarrollo: Jhonatan Muñoz
 *
 * Qué hace:
 *  1. Guarda tus datos de Vertex en tu Google Drive (vertex-datos.json).
 *  2. Lee SOLO correos de BCP, BBVA y Yape de los últimos 30 días y los registra como gastos.
 *  3. (Opcional) Lo hace solo cada hora con instalarAutomatico().
 *  4. Te avisa en el celular de pagos, tarjetas, eventos y medicinas, aunque Vertex esté cerrada (instalarAvisos()).
 *
 * Propiedad del script (Configuración del proyecto → Propiedades del script):
 *  PLATFORM_KEY   Clave que tú inventas (la misma va en Vertex → Ajustes)
 *
 * Nunca envía ni borra correos. Solo lee.
 */
var P = PropertiesService.getScriptProperties();
var FILE = 'vertex-datos.json';
var QUERY = '(from:bbva.com.pe OR from:notificacionesbcp.com.pe OR from:bcp.com.pe OR from:viabcp.com OR from:yape.pe) newer_than:30d';

function doGet() { return out_({ ok: true, servicio: 'Conector Vertex activo' }); }

function doPost(e) {
  var b = {};
  try { b = JSON.parse((e.postData && e.postData.contents) || '{}'); } catch (err) { return out_({ ok: false, error: 'JSON inválido' }); }
  if (!P.getProperty('PLATFORM_KEY') || b.key !== P.getProperty('PLATFORM_KEY')) return out_({ ok: false, error: 'Clave del conector incorrecta' });
  var lock = LockService.getScriptLock(); lock.waitLock(20000);
  try {
    var d = load_() || {};
    if (b.action === 'ping') return out_({ ok: true });
    if (b.action === 'load') return out_({ ok: true, data: d });
    if (b.action === 'save') { d = merge_(d, b.data || {}); store_(d); return out_({ ok: true, data: d }); }
    if (b.action === 'scan') {
      d = merge_(d, b.data || {});
      var r = scan_(d); store_(d);
      return out_({ ok: true, data: d, nuevos: r.nuevos, otraMoneda: r.otra });
    }
    return out_({ ok: false, error: 'Acción desconocida' });
  } catch (err) { return out_({ ok: false, error: String(err) }); }
  finally { lock.releaseLock(); }
}

// Junta lo que mandó la app con lo que ya estaba (sin perder los gastos que llegaron por correo)
function merge_(srv, cli) {
  var out = cli; var seen = {}; var del = {};
  (cli.deleted || []).concat(srv.deleted || []).forEach(function (i) { del[i] = 1; });
  out.deleted = Object.keys(del);
  var all = (cli.expenses || []).concat(srv.expenses || []); out.expenses = [];
  all.forEach(function (x) { if (!seen[x.id] && !del[x.id]) { seen[x.id] = 1; out.expenses.push(x); } });
  var ids = {}; (cli.importedIds || []).concat(srv.importedIds || []).forEach(function (i) { ids[i] = 1; });
  out.importedIds = Object.keys(ids);
  out.scanInfo = srv.scanInfo && (!cli.scanInfo || srv.scanInfo.at > cli.scanInfo.at) ? srv.scanInfo : cli.scanInfo;
  out.updated = Date.now();
  return out;
}

function scan_(d) {
  var done = {}; (d.importedIds || []).forEach(function (i) { done[i] = 1; });
  d.expenses = d.expenses || []; d.importedIds = d.importedIds || [];
  var nuevos = 0, otra = 0, news = [];
  if (!P.getProperty('RESET_V2')) { d.importedIds = []; done = {}; P.setProperty('RESET_V2', '1'); }
  var have = {}, del = {}; d.expenses.forEach(function (e) { have[e.id] = 1; }); (d.deleted || []).forEach(function (i) { del[i] = 1; });
  GmailApp.search(QUERY, 0, 80).forEach(function (th) {
    th.getMessages().forEach(function (m) {
      var id = m.getId(); if (done[id]) return;
      var text = flat_(m.getSubject() + ' ' + (m.getPlainBody() || m.getBody()));
      var x = parse_(text); if (!x) return;
      done[id] = 1; d.importedIds.push(id);
      if (have['g' + id] || del['g' + id]) return;
      if (x.currency !== 'PEN') { otra++; return; }
      var date = x.date || Utilities.formatDate(m.getDate(), Session.getScriptTimeZone(), 'yyyy-MM-dd');
      d.expenses.unshift({ id: 'g' + id, cat: cat_(x.merchant), name: x.merchant, amount: x.amount, date: date, src: x.bank });
      nuevos++; news.push(x.merchant + ' · S/ ' + x.amount.toFixed(2));
    });
  });
  d.scanInfo = { at: Date.now(), nuevos: nuevos, otraMoneda: otra, automatico: !!P.getProperty('AUTO_RUN') };
  return { nuevos: nuevos, otra: otra, news: news };
}

var MESES = { enero: 1, febrero: 2, marzo: 3, abril: 4, mayo: 5, junio: 6, julio: 7, agosto: 8, setiembre: 9, septiembre: 9, octubre: 10, noviembre: 11, diciembre: 12, ene: 1, feb: 2, mar: 3, abr: 4, may: 5, jun: 6, jul: 7, ago: 8, set: 9, sep: 9, oct: 10, nov: 11, dic: 12 };
function p2_(n) { return ('0' + n).slice(-2); }
function flat_(r) { return String(r).replace(/&nbsp;/gi, ' ').replace(/&amp;/gi, '&').replace(/&[a-z]+;/gi, ' ').replace(/\s+/g, ' ').trim(); }
function num_(s) { return parseFloat(s.replace(/,(?=\d{3}\b)/g, '').replace(',', '.')); }
function clean_(r) { return r.replace(/^[A-Z]{2,6}\s?\*\s?/, '').replace(/\s+/g, ' ').trim().toLowerCase().replace(/(^|[\s\-\/])([a-záéíóúñ])/g, function (_, a, b) { return a + b.toUpperCase(); }); }
function date_(t) {
  var a = t.match(/(\d{1,2}) de ([a-záéíóú]+) de (\d{4})/i) || t.match(/(\d{1,2}) ([a-záéíóú]{3,10})\.?,? (\d{4})/i);
  if (a) { var m = MESES[a[2].toLowerCase()]; if (m) return a[3] + '-' + p2_(m) + '-' + p2_(+a[1]); }
  var b = t.match(/\b(\d{1,2})\/(\d{1,2})\/(\d{4})\b/); return b ? b[3] + '-' + p2_(+b[2]) + '-' + p2_(+b[1]) : null;
}
function from_(t, re) { var i = t.search(re); return i >= 0 ? t.slice(i) : t; }
function parse_(t) {
  var m = t.match(/Realizaste un consumo de \*?(S\/|US\$|\$)\s?([\d.,]+\d)\*? con tu .{3,60}? en \*?(.+?)\.\*?\s/i);
  if (m) return { bank: 'BCP', amount: num_(m[2]), currency: m[1] === 'S/' ? 'PEN' : 'USD', merchant: clean_(m[3].replace(/\*\d+$/, '')), date: date_(from_(t, /Fecha y hora/i)) };
  m = t.match(/Comercio:?\s+(.+?)\s+Monto:?\s+([\d.,]+\d)\s+Moneda:?\s+([A-Z]{3})/i);
  if (m) return { bank: 'BBVA', amount: num_(m[2]), currency: m[3].toUpperCase(), merchant: clean_(m[1]), date: date_(from_(t, /Fecha:/i)) };
  m = t.match(/(?:Acabas de yapear|Monto de yapeo)[^]*?Monto de yapeo\W*S\/\s?([\d.,]+\d)/i);
  if (m && /yape/i.test(t) && !/recibiste|te yape/i.test(t)) { var bn = t.match(/Nombre del Beneficiario\s+(.+?)\s+N[º°o]\s+de operaci/i); return { bank: 'Yape', amount: num_(m[1]), currency: 'PEN', merchant: bn ? clean_(bn[1]) : 'Pago con Yape', date: date_(from_(t, /Fecha y Hora de la operaci/i)) }; }
  m = t.match(/Monto total\s+S\/\s?([\d.,]+\d)/i);
  if (m && /yape/i.test(t) && !/recibiste|te yape|te envi/i.test(t)) return { bank: 'Yape', amount: num_(m[1]), currency: 'PEN', merchant: /servicio/i.test(t) ? 'Pago de servicio (Yape)' : 'Pago con Yape', date: date_(from_(t, /Fecha y hora/i)) };
  return null;
}
function cat_(t) {
  t = (t || '').toLowerCase();
  if (/netflix|spotify|disney|hbo|prime video|amazon prime|youtube|icloud|apple\.com|google one|chatgpt|openai|anthropic|claude|crunchyroll|suscripci|dropbox|microsoft 365|canva|adobe/.test(t)) return 'Suscripciones';
  if (/mascota|veterinari|petshop|pet shop|perro|gato|croqueta|purina|pedigree/.test(t)) return 'Mascota';
  if (/ropa|polo|zapatill|zapato|zara|h&m|ripley|saga|falabella|oechsle|forever|topitop|adidas|nike|puma|tailoy|calzado|casaca|jean/.test(t)) return 'Ropa y calzado';
  if (/\bplin\b|plin-/.test(t)) return 'Familia y amigos';
  if (/cine|steam|playstation|xbox|nintendo|juego|concierto|teatro|discoteca|cinemark|cineplanet|hotel|viaje/.test(t)) return 'Entretenimiento';
  if (/grifo|primax|repsol|petroperu|gasolina|combustible|gnv|glp|diesel|petroleo/.test(t)) return 'Auto';
  if (/uber|cabify|taxi|indriver|metropolitano|pasaje|aeropuerto|peaje|estacionamiento|parking|cochera|rutas de lima|lamsac|covisol/.test(t)) return 'Transporte';
  if (/almuerzo|menu|menú|desayuno|chifa|polleria|pollería|loncheria|cevicheria/.test(t)) return 'Almuerzo';
  if (/rappi|kfc|mcdonald|bembos|pizza|restaurant|starbucks|pardos|burger|cafe|café|pedidosya|delivery/.test(t)) return 'Restaurante y delivery';
  if (/plaza ?vea|wong|tottus|metro|vivanda|mercado|bodega|supermercado|oxxo|mass|tambo|amazon|aliexpress|shopee|temu|coolbox|hiraoka|curacao|ferreter|sodimac|promart|maestro|electrodomestico/.test(t)) return 'Compras para la casa';
  if (/farmacia|inkafarma|mifarma|botica|clinica|clínica|hospital|medic|dental|gimnasio/.test(t)) return 'Salud';
  if (/luz|agua|alquiler|internet|claro|movistar|entel|sedapal|enel|servicio|gas|calidda|cable/.test(t)) return 'Servicios de casa';
  return 'Otros';
}
function load_() {
  var it = DriveApp.getFilesByName(FILE);
  return it.hasNext() ? JSON.parse(it.next().getBlob().getDataAsString()) : null;
}
function store_(d) {
  var s = JSON.stringify(d), it = DriveApp.getFilesByName(FILE);
  if (it.hasNext()) it.next().setContent(s); else DriveApp.createFile(FILE, s, 'application/json');
}
function out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }

// ---- Ejecuta estas funciones desde el editor ----
function autorizar() { GmailApp.search('newer_than:1d', 0, 1); DriveApp.getRootFolder(); Logger.log('Autorizado ✓'); }

// Revisión automática cada hora (aunque Vertex esté cerrada)
function autoScan() {
  var lock = LockService.getScriptLock(); lock.waitLock(20000);
  try { var d = load_() || {}; var r = scan_(d); store_(d); gastosPush_(d, r.news || []); } finally { lock.releaseLock(); }
}
function gastosPush_(d, news) {
  if (!news.length || !d.notify || !d.notify.on || !d.notify.topic) return;
  var msg = news.length <= 4 ? news.join('\n') : news.length + ' gastos nuevos detectados en tus correos';
  try { UrlFetchApp.fetch('https://ntfy.sh', { method: 'post', contentType: 'application/json', muteHttpExceptions: true, payload: JSON.stringify({ topic: d.notify.topic, title: '💸 Nuevo gasto en Vertex', message: msg, priority: 3, tags: ['money_with_wings'] }) }); } catch (err) { Logger.log('ntfy: ' + err); }
}
function instalarAutomatico() {
  ScriptApp.getProjectTriggers().forEach(function (t) { if (t.getHandlerFunction() === 'autoScan') ScriptApp.deleteTrigger(t); });
  ScriptApp.newTrigger('autoScan').timeBased().everyHours(1).create();
  P.setProperty('AUTO_RUN', '1'); Logger.log('Revisión automática cada hora activada ✓');
}

// ---- AVISOS: suenan en tu celular aunque Vertex esté cerrada ----
// Revisa cada 5 minutos tus pagos, tarjetas, eventos y medicinas y te los manda con ntfy (app gratis).
// Solo usa el tema secreto que Vertex generó; no envía correos ni lee nada nuevo.
var AV_FILE = 'vertex-avisos.json';
var TZ = 'America/Lima';
var FREQ_H = { 'diaria': 0, '12': 12, '8': 8, '6': 6, '4': 4 };

function avLoad_() {
  var it = DriveApp.getFilesByName(AV_FILE);
  try { return it.hasNext() ? JSON.parse(it.next().getBlob().getDataAsString()) : {}; } catch (e) { return {}; }
}
function avStore_(o) {
  var s = JSON.stringify(o), it = DriveApp.getFilesByName(AV_FILE);
  if (it.hasNext()) it.next().setContent(s); else DriveApp.createFile(AV_FILE, s, 'application/json');
}
function avMin_(hhmm) { var a = String(hhmm || '').split(':'); return a.length === 2 ? (+a[0]) * 60 + (+a[1]) : null; }
function avTimes_(m) {
  if (!m.time) return [];
  var h = FREQ_H[m.freq || 'diaria'];
  if (h === undefined || m.freq === 'sos') return [];
  if (!h) return [m.time];
  var p = m.time.split(':'), a = [];
  for (var t = +p[0]; t < +p[0] + 24; t += h) a.push(p2_(t % 24) + ':' + p2_(+p[1]));
  return a;
}
// días desde "hoy" hasta la fecha (yyyy-MM-dd), sin líos de horario
function avDiff_(todayStr, dateStr) {
  var a = todayStr.split('-'), b = dateStr.split('-');
  return Math.round((Date.UTC(+b[0], +b[1] - 1, +b[2]) - Date.UTC(+a[0], +a[1] - 1, +a[2])) / 86400000);
}
function avDue_(y, m, day) { // fecha de vencimiento en ese mes (ajusta el día si el mes es corto)
  var last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  return y + '-' + p2_(m) + '-' + p2_(Math.min(day, last));
}

function avisos() {
  var d = load_(); if (!d || !d.notify || !d.notify.on || !d.notify.topic) return;
  var now = new Date();
  var today = Utilities.formatDate(now, TZ, 'yyyy-MM-dd');
  var nowMin = +Utilities.formatDate(now, TZ, 'H') * 60 + (+Utilities.formatDate(now, TZ, 'm'));
  var y = +today.slice(0, 4), mo = +today.slice(5, 7);
  var ymNow = today.slice(0, 7), nx = mo === 12 ? [y + 1, 1] : [y, mo + 1], ymNext = nx[0] + '-' + p2_(nx[1]);
  var sent = avLoad_(), q = [];
  function add(key, targetMin, win, title, msg, prio) {
    if (sent[key]) return;
    if (nowMin >= targetMin && nowMin < targetMin + win) q.push({ key: key, title: title, message: msg, priority: prio || 3 });
  }
  var money = function (n) { return 'S/ ' + Number(n || 0).toFixed(2); };
  var words = function (n) { return n === 0 ? 'hoy' : n === 1 ? 'mañana' : 'en ' + n + ' días'; };

  (d.payments || []).forEach(function (p) {
    [[y, mo, ymNow], [nx[0], nx[1], ymNext]].forEach(function (c) {
      if (p.paid && p.paid[c[2]]) return;
      var n = avDiff_(today, avDue_(c[0], c[1], p.day));
      if (n >= 0 && n <= 3 && (n === 0 || n === 1 || n === 3))
        add('p|' + p.id + '|' + c[2] + '|' + n, 540, 180, '💳 Pago por vencer', p.name + ' vence ' + words(n) + ' · ' + money(p.amount), n === 0 ? 4 : 3);
      if (n < 0 && n >= -10 && c[2] === ymNow)
        add('p|' + p.id + '|' + today + '|late', 540, 180, '⚠️ Pago vencido', p.name + ' venció hace ' + (-n) + ' día' + (n === -1 ? '' : 's') + ' · ' + money(p.amount), 4);
    });
  });
  (d.cards || []).forEach(function (c) {
    [[y, mo, ymNow], [nx[0], nx[1], ymNext]].forEach(function (x) {
      var n = avDiff_(today, avDue_(x[0], x[1], c.due));
      if (n === 0 || n === 3) add('c|' + c.id + '|' + x[2] + '|' + n, 540, 180, '💳 Pago de tarjeta', c.name + ' · paga ' + words(n), n === 0 ? 4 : 3);
    });
  });
  (d.debts || []).forEach(function (db) {
    if (!db.day || (db.paidCount || 0) >= db.total) return;
    [[y, mo, ymNow], [nx[0], nx[1], ymNext]].forEach(function (c) {
      if (c[2] === ymNow && db.lastPaid === ymNow) return;
      var n = avDiff_(today, avDue_(c[0], c[1], db.day));
      if (n >= 0 && n <= 3 && (n === 0 || n === 1 || n === 3))
        add('d|' + db.id + '|' + c[2] + '|' + n, 540, 180, '💳 Cuota por vencer', db.name + ' · cuota ' + money(db.installment) + ' vence ' + words(n), n === 0 ? 4 : 3);
      if (n < 0 && n >= -10 && c[2] === ymNow)
        add('d|' + db.id + '|' + today + '|late', 540, 180, '⚠️ Cuota vencida', db.name + ' · cuota venció hace ' + (-n) + ' día' + (n === -1 ? '' : 's') + ' · ' + money(db.installment), 4);
    });
  });
  (d.events || []).forEach(function (e) {
    var n = avDiff_(today, e.date), ur = !!e.urgent;
    if (ur && (n === 3 || n === 1)) add('e|' + e.id + '|urg|' + n, 540, 180, '🚨 Urgente', e.title + ' ' + words(n) + (e.time ? ' a las ' + e.time : ''), 5);
    if (n === 1) add('e|' + e.id + '|prev', 1200, 180, '📅 Mañana', e.title + (e.time ? ' a las ' + e.time : ''), ur ? 5 : 3);
    if (n === 0) {
      var t = avMin_(e.time);
      if (t === null) add('e|' + e.id + '|day', 480, 180, ur ? '🚨 Urgente hoy' : '📅 Hoy', e.title, ur ? 5 : 3);
      else add('e|' + e.id + '|30', Math.max(0, t - 30), 45, ur ? '🚨 Urgente en 30 minutos' : '📅 En 30 minutos', e.title + ' · ' + e.time, ur ? 5 : 4);
    }
  });
  (d.meds || []).forEach(function (m) {
    avTimes_(m).forEach(function (h) {
      if (m.taken && m.taken[today + '@' + h]) return;
      var t = avMin_(h); if (t === null) return;
      add('m|' + m.id + '|' + today + '|' + h, t, 20, '💊 Hora de tu medicina', (d.notify.medNames ? m.name + (m.dose ? ' · ' + m.dose + ' · ' : ' · ') : '') + h, 4);
    });
  });

  if (!q.length) return;
  q.forEach(function (it) {
    var body = { topic: d.notify.topic, title: it.title, message: it.message, priority: it.priority, tags: ['bell'] };
    if (d.notify.click) body.click = d.notify.click;
    try {
      var r = UrlFetchApp.fetch('https://ntfy.sh', { method: 'post', contentType: 'application/json', payload: JSON.stringify(body), muteHttpExceptions: true });
      if (r.getResponseCode() < 300) sent[it.key] = Date.now();
    } catch (err) { Logger.log('ntfy: ' + err); }
  });
  var cut = Date.now() - 4 * 86400000; Object.keys(sent).forEach(function (k) { if (sent[k] < cut) delete sent[k]; });
  avStore_(sent);
}

function instalarAvisos() {
  ScriptApp.getProjectTriggers().forEach(function (t) { if (t.getHandlerFunction() === 'avisos') ScriptApp.deleteTrigger(t); });
  ScriptApp.newTrigger('avisos').timeBased().everyMinutes(5).create();
  Logger.log('Avisos activados: se revisan cada 5 minutos ✓');
}
function probarAvisos() {
  var d = load_(); if (!d || !d.notify || !d.notify.topic) { Logger.log('Primero activa los avisos en Vertex → Ajustes'); return; }
  UrlFetchApp.fetch('https://ntfy.sh', { method: 'post', contentType: 'application/json', payload: JSON.stringify({ topic: d.notify.topic, title: '✅ Vertex', message: 'Los avisos funcionan, incluso con Vertex cerrada.', priority: 4 }) });
  Logger.log('Aviso de prueba enviado ✓');
}
